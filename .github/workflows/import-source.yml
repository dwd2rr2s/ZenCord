name: Import full ZenCord source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current source bundle
        run: |
          curl --fail --location --retry 3             https://zencord.co.uk/downloads/ZenCord-Source-1.15.1.zip             -o /tmp/zencord-source.zip

      - name: Replace repository source
        run: |
          find . -mindepth 1 -maxdepth 1             ! -name .git             ! -name .github             -exec rm -rf {} +
          unzip -q /tmp/zencord-source.zip -d /tmp/zencord-source
          cp -a /tmp/zencord-source/. .
          rm -f .env

      - name: Verify old branding is absent
        run: |
          if grep -RniI --exclude-dir=.git --exclude='*.zip' -i 'endcord' .; then
            echo "Previous branding found."
            exit 1
          fi

      - name: Commit imported source
        run: |
          git config user.name "ZenCord Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m "Import ZenCord 1.15.1 full source"
          git push
